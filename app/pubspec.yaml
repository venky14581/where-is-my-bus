name: where_is_my_bus
description: "Live college bus tracking for Amrita Coimbatore day scholars"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.10.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: any
  geolocator: ^14.1.1
  flutter_foreground_task: ^10.0.0
  firebase_database: ^12.6.0
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  cloud_functions: ^6.5.0
  http: ^1.6.0
  crypto: ^3.0.7
  razorpay_flutter: ^1.4.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
