# Sized for an 8 GB laptop: Flutter's template default (-Xmx8G) is more than
# the machine has and the build daemon gets killed.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Compile Kotlin inside the Gradle process rather than a second daemon, and
# without incremental caches: they fail when the project (D:) and the pub
# cache (C:) are on different drives.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
